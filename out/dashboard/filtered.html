<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Token Radar — pre-token DeFi, ranked by implied value</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header>
  <div>
    <h1>Token Radar</h1>
    <p class="lede" id="lede"></p>
  </div>
  <dl class="stats" id="stats"></dl>
</header>
<main>
  <section id="picks" aria-label="Top picks"></section>
  <section id="cats" aria-label="Implied value by category"></section>
  <section class="controls" aria-label="Controls">
    <label>Search <input id="q" type="search" placeholder="name or slug" autocomplete="off"></label>
    <label>Category <select id="cat"><option value="">All categories</option></select></label>
    <div class="tabs" role="tablist" aria-label="Board">
      <button id="tab-pre" role="tab" aria-selected="true">Pre-token radar</button>
      <button id="tab-live" role="tab" aria-selected="false">Live comparables</button>
      <button id="tab-set" role="tab" aria-selected="false">Set aside</button>
    </div>
  </section>
  <section id="board" aria-label="Board"></section>
  <section id="model" aria-label="How the radar works"></section>
</main>
<dialog id="detail"></dialog>
<script src="../data.js"></script>
<script>history.replaceState(null, "", "?cat=Lending");</script>
<script src="app.js"></script>
</body>
</html>
